# ============================================================
#  YouTube-Daten vorab holen (DSGVO-konform)
#
#  Holt taeglich Kanal-Statistiken, Videoliste und Vorschau-
#  bilder von YouTube und committet sie als statische Dateien
#  (vlogs-data.json + assets/vlog-thumbs/). Dadurch fragt der
#  Browser des Besuchers nie selbst bei Google an.
#
#  Voraussetzung: Repository-Secret YT_API_KEY muss gesetzt sein
#  (Settings -> Secrets and variables -> Actions -> New secret).
# ============================================================
name: YouTube-Daten aktualisieren

on:
  # Taeglich um 05:00 UTC
  schedule:
    - cron: '0 5 * * *'
  # Zusaetzlich manuell ausloesbar (Actions-Tab -> Run workflow)
  workflow_dispatch:

# Schreibrechte, damit die Action committen darf
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: YouTube-Daten holen
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/fetch-youtube.js

      - name: Aenderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vlogs-data.json assets/vlog-thumbs
          if git diff --staged --quiet; then
            echo "Keine Aenderungen, nichts zu committen."
          else
            git commit -m "YouTube-Daten aktualisiert (automatisch)"
            git push
          fi
