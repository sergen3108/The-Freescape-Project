# ============================================================
#  Bilder optimieren
#
#  Verkleinert neue oder ausgetauschte Fotos unter assets/img/
#  auf hoechstens 1920 px und legt die Vorschaubilder unter
#  assets/img/thumbs/ an (scripts/optimize-images.js). Bereits
#  bearbeitete Bilder stehen in scripts/image-manifest.json und
#  werden nicht erneut komprimiert.
# ============================================================
name: Bilder optimieren

on:
  push:
    branches: [main]
    paths:
      - 'assets/img/**'
      - '!assets/img/thumbs/**'
  # Zusaetzlich manuell ausloesbar (Actions-Tab -> Run workflow)
  workflow_dispatch:

# Schreibrechte, damit die Action committen darf
permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: sharp installieren
        run: npm install --no-save --no-audit --no-fund sharp@0.33.5

      - name: Bilder verkleinern und Vorschaubilder erzeugen
        run: node scripts/optimize-images.js

      - name: Aenderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/img scripts/image-manifest.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen, nichts zu committen."
          else
            git commit -m "Bilder optimiert (automatisch)"
            # Falls parallel eine andere Action gepusht hat
            git pull --rebase
            git push
          fi
